<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0d10;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #wrap { position: relative; width: 100%; height: 100vh; }
  canvas { display: block; background: #0a0d10; }

  .hud {
    position: absolute; top: 16px; left: 20px;
    color: #d4af37;
    font-size: 22px;
    letter-spacing: 1px;
    text-shadow: 0 0 6px rgba(212,175,55,0.5);
    user-select: none;
  }
  .quit {
    position: absolute; top: 12px; right: 20px;
    background: #d9534f;
    color: #fff;
    border: none;
    padding: 10px 18px;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 1px;
    border-radius: 4px;
    cursor: pointer;
  }
  .quit:hover { background: #c9433f; }
  .hint {
    position: absolute; bottom: 14px; left: 20px;
    color: #6a7178;
    font-size: 13px;
    letter-spacing: 0.5px;
    user-select: none;
  }
  .overlay {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    background: rgba(10,13,16,0.85);
    color: #d4af37;
    text-align: center;
  }
  .overlay h1 { font-size: 34px; margin: 0 0 8px; letter-spacing: 2px; }
  .overlay p { color: #9aa0a6; margin: 4px 0 18px; font-size: 14px; }
  .overlay button {
    background: transparent;
    border: 1px solid #d4af37;
    color: #d4af37;
    padding: 10px 22px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 1px;
    border-radius: 4px;
    cursor: pointer;
  }
  .overlay button:hover { background: rgba(212,175,55,0.12); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div class="hud">SCORE: <span id="score">0</span></div>
  <button class="quit" id="quitBtn">&times; QUIT</button>
  <div class="hint">Arrow keys to move &middot; ESC to quit</div>

  <div class="overlay" id="overlay">
    <h1 id="overlayTitle">GAME OVER</h1>
    <p id="overlaySub">Score: 0</p>
    <button id="restartBtn">PLAY AGAIN</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlaySub = document.getElementById('overlaySub');

const GOLD = '#d4af37';
const RED = '#e05d52';
const GRID_LINE = 'rgba(212,175,55,0.06)';
const CELL = 24;

let cols, rows;
let snake, dir, nextDir, food, score, running, gameOverFlag, tickMs, timer;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  cols = Math.floor(canvas.width / CELL);
  rows = Math.floor(canvas.height / CELL);
}

function randCell() {
  return { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
}

function placeFood() {
  let f;
  do {
    f = randCell();
  } while (snake.some(s => s.x === f.x && s.y === f.y));
  food = f;
}

function resetGame() {
  resize();
  snake = [
    { x: Math.floor(cols / 2), y: Math.floor(rows / 2) },
    { x: Math.floor(cols / 2) - 1, y: Math.floor(rows / 2) },
    { x: Math.floor(cols / 2) - 2, y: Math.floor(rows / 2) }
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  scoreEl.textContent = score;
  tickMs = 110;
  gameOverFlag = false;
  running = true;
  overlay.style.display = 'none';
  placeFood();
  if (timer) clearInterval(timer);
  timer = setInterval(step, tickMs);
}

function setSpeed() {
  clearInterval(timer);
  timer = setInterval(step, tickMs);
}

function step() {
  if (!running) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    placeFood();
    if (tickMs > 55 && score % 3 === 0) {
      tickMs -= 6;
      setSpeed();
    }
  } else {
    snake.pop();
  }

  draw();
}

function endGame() {
  running = false;
  gameOverFlag = true;
  clearInterval(timer);
  overlayTitle.textContent = 'GAME OVER';
  overlaySub.textContent = 'Score: ' + score;
  overlay.style.display = 'flex';
}

function drawGrid() {
  ctx.strokeStyle = GRID_LINE;
  ctx.lineWidth = 1;
  for (let x = 0; x <= canvas.width; x += CELL) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= canvas.height; y += CELL) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
}

function drawCell(cell, color, glow) {
  const pad = 3;
  ctx.fillStyle = color;
  if (glow) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
  } else {
    ctx.shadowBlur = 0;
  }
  ctx.fillRect(cell.x * CELL + pad, cell.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
  ctx.shadowBlur = 0;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();

  drawCell(food, RED, true);

  snake.forEach((seg, i) => {
    if (i === 0) {
      drawCell(seg, GOLD, true);
    } else {
      const fade = Math.max(0.35, 1 - i * 0.03);
      ctx.fillStyle = GOLD;
      ctx.globalAlpha = fade;
      const pad = 3;
      ctx.fillRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
      ctx.globalAlpha = 1;
    }
  });
}

window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'Escape') { quit(); return; }
  if (!running) {
    if (k === ' ' || k === 'Enter') resetGame();
    return;
  }
  if (k === 'ArrowUp' && dir.y !== 1) nextDir = { x: 0, y: -1 };
  else if (k === 'ArrowDown' && dir.y !== -1) nextDir = { x: 0, y: 1 };
  else if (k === 'ArrowLeft' && dir.x !== 1) nextDir = { x: -1, y: 0 };
  else if (k === 'ArrowRight' && dir.x !== -1) nextDir = { x: 1, y: 0 };
  else return;
  e.preventDefault();
});

function quit() {
  running = false;
  clearInterval(timer);
  overlayTitle.textContent = 'PAUSED';
  overlaySub.textContent = 'Score: ' + score;
  overlay.style.display = 'flex';
}

document.getElementById('quitBtn').addEventListener('click', quit);
document.getElementById('restartBtn').addEventListener('click', resetGame);

window.addEventListener('resize', () => {
  resize();
  draw();
});

resetGame();
draw();
</script>
</body>
</html>
